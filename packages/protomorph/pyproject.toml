[tool.poetry]
name = "protomorph"
version = "0.1.0"
description = "Host-agnostic morphological data model"
authors = ["jdluque <jdluque@leitat.org>"]

[[tool.poetry.packages]]
include = "protomorph"
from = "src"

[tool.poetry.dependencies]
python = "^3.13"
protobase = { path = "../protobase", develop = true }

[tool.poetry-monoranger-plugin]
enabled = true
monorepo-root = "../.."
version-pinning-rule = "=="

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pyright = ">=1.1.408,<2.0.0"
coverage = ">=7.13.4,<8.0.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocstrings = {extras = ["python"], version = ">=0.27"}
marimo = ">=0.9"

[tool.coverage.run]
source = ["src/protomorph"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
